<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hueday 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 友達どうしの気軽なSNS。明るく、写真が主役
   IDEA: 白地図帳に色鉛筆で塗っていく旅のノート
   PICTURE: 塗られていく日本地図（プロフィールとマップ）と写真フィード
   COLOUR and TYPE: 白地+墨色、地方ごとの色鉛筆8色、アクセントはコーラル / システムフォント（Instagramと同じ） + ロゴはFredoka
   LAYOUT: スマホ1カラム、下にタブバー、上にヘッダー。地図はフルスクリーン */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121418);--ink:light-dark(#1b1f27,#eef0f3);--sub:light-dark(#6b7280,#9aa1ad);--line:light-dark(#e8eaee,#262a31);--land:light-dark(#eceef1,#262b33);--landline:light-dark(#d9dce2,#353b45);--sea:light-dark(#f7f9fb,#0d0f12);--card:light-dark(#fff,#181b20);--acc:#ff5a3c;--soft:light-dark(#f4f5f7,#1f2329)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN",Roboto,"Noto Sans JP",Meiryo,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(var(--navh,64px) + 24px)}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{font:600 26px/1 "Fredoka",sans-serif;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;grid-template-columns:repeat(2,8px);gap:2px}.logo i b{width:8px;height:8px;border-radius:2px}
.seg{margin-left:auto;display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);min-height:32px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 6px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--sub);min-height:56px}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs svg{width:26px;height:26px}
nav.tabs .plus span{width:44px;height:32px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#fff}
.view{display:none}.view.on{display:block}
.note{font-size:12px;color:var(--sub);padding:8px 16px}
/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.story{border:0;background:none;display:grid;justify-items:center;gap:4px;font-size:12px;flex:none;width:68px}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(var(--c1),var(--c2),var(--c1))}
.av{border-radius:50%;display:grid;place-items:center;font:700 20px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif;color:#fff;width:100%;height:100%;border:3px solid var(--bg)}
.av.s{width:34px;height:34px;font-size:14px;border:0;flex:none}
/* card */
.card{border-bottom:1px solid var(--line);padding-bottom:10px}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ch .who{font-weight:700;border:0;background:none;padding:0;text-align:left}
.ch .loc{font-size:12px;color:var(--sub);border:0;background:none;padding:0;display:flex;align-items:center;gap:3px;text-align:left}
.ch .loc svg{width:12px;height:12px;flex:none;color:var(--acc)}
.media{position:relative;aspect-ratio:1;background:var(--soft);overflow:hidden}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.media .area{position:absolute;left:10px;bottom:10px;background:#000a;color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;display:flex;gap:6px;align-items:center}
.media .area i{width:10px;height:10px;border-radius:3px}
.acts{display:flex;gap:4px;padding:6px 8px 0}
.acts button{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.acts button svg{width:26px;height:26px}
.acts .gmi{width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}.acts .gmi svg{width:26px;height:26px}
.acts .sp{flex:1}
.cat{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;border:1.5px solid;margin-right:6px;vertical-align:1px}
.seg.catseg{margin:0;width:100%;display:flex;padding:3px 2px}.seg.catseg button{flex:1 1 auto;min-width:0;padding:6px 0;font-size:12px;letter-spacing:-.02em;white-space:nowrap;min-height:34px}
.gm.book{border-color:#bf0000;color:#bf0000}.gm .pr{font-size:9px;font-weight:700;border:1px solid currentColor;border-radius:3px;padding:0 3px;margin-left:2px;opacity:.8}
.gm.go{background:var(--acc);border-color:var(--acc);color:#fff}.gm.go svg{color:#fff}
.vissel{border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:12px;padding:3px 6px;color:var(--sub)}
.vis{display:grid;gap:6px;font-size:13px}.vis .row{display:flex;gap:6px;flex-wrap:wrap}
.vis button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;min-height:36px}.vis button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts button.on.like{color:var(--acc)}.acts button.on.like path{fill:var(--acc)}
.acts button.on.wish path{fill:currentColor}
.cb{padding:0 14px;font-size:14px}
.cb b{font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-right:6px;vertical-align:1px}
.via{font-size:12px;color:var(--acc);font-weight:700;margin:4px 0}
.cmts{color:var(--sub);font-size:13px;margin-top:4px}
.cmts p{margin:2px 0;color:var(--ink)}
.cform{display:flex;gap:8px;padding:6px 14px 0}
.cform input{flex:1;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;font-size:16px}
.cform button{border:0;background:none;color:var(--acc);font-weight:700}
.time{font-size:11px;color:var(--sub);padding:4px 14px 0}
/* map */
.mapwrap{position:fixed;inset:var(--headh,57px) 0 var(--navh,64px) 0;max-width:560px;margin:0 auto;background:var(--sea)}
svg.map{width:100%;height:100%;display:block;touch-action:none;user-select:none}
svg.map path.m{fill:var(--land);stroke:var(--landline);stroke-width:.4;vector-effect:non-scaling-stroke;transition:fill .5s}
svg.map path.c{fill:var(--land);stroke:var(--landline);stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .5s}
svg.map path.pb{fill:none;stroke:light-dark(#aab0ba,#4a515c);stroke-width:.9;vector-effect:non-scaling-stroke;pointer-events:none}
svg.map.moving path.m,svg.map.moving path.c{stroke:none;transition:none}
svg.map g.pin{cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
svg.map circle.pin{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}
.mapbar{position:absolute;left:12px;right:12px;top:12px;display:grid;gap:8px;pointer-events:none}
.mapbar>*{pointer-events:auto}
.who-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;flex:none;min-height:40px;box-shadow:0 2px 8px #0001}
.chip .av{width:26px;height:26px;font-size:12px;border:0}
.chip.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.stat{background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:0 2px 12px #0002;display:flex;align-items:center;gap:12px;width:max-content;max-width:100%}
.stat .row{display:flex;align-items:center;gap:10px}.stat .col{display:grid;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;align-items:center}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:10px;height:10px;border-radius:3px}.legend button{border:0;background:none;color:var(--acc);font-weight:700;font-size:12px;padding:4px 0}
.mem{display:flex;align-items:center;gap:10px;padding:8px 16px;border:0;background:none;width:100%;text-align:left;min-height:52px}
.mem .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:14px}
.mem.on .ck{background:var(--acc);border-color:var(--acc)}
.stat strong{font:700 28px/1 -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif}
.stat small{color:var(--sub);font-size:12px;display:block}
.meter{height:6px;border-radius:3px;background:var(--soft);width:110px;overflow:hidden;margin-top:4px}.meter b{display:block;height:100%;background:var(--acc)}
.zoom{position:absolute;right:12px;bottom:14px;display:grid;gap:6px}
.zoom button.txt{font-size:12px;width:52px;margin-left:-8px}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700;box-shadow:0 2px 8px #0001}
.pickbar{position:absolute;left:12px;right:12px;bottom:14px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:10px;font-weight:700}
.pickbar.on{display:flex}.pickbar button{margin-left:auto;border:0;border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--ink);font-weight:700}
/* profile */
.prof{padding:16px}
.ph{display:flex;align-items:center;gap:16px}
.ph .bigav{width:84px;height:84px;flex:none}
.ph .bigav .av{font-size:32px;border:0}
.nums{display:flex;flex:1;justify-content:space-around;text-align:center}
.nums b{font:700 20px/1.2 -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif;display:block}.nums span{font-size:12px;color:var(--sub)}
.pname{margin:10px 0 2px;font:700 17px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif;display:flex;gap:8px;align-items:center}
.pname button{border:1px solid var(--line);background:none;border-radius:8px;font-size:12px;padding:4px 8px}
.bio{font-size:13px;color:var(--sub);margin:0}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:10px;padding:10px;font-weight:700;background:var(--soft);min-height:44px}
.btn.pri{background:var(--acc);color:#fff}
.pmap{height:min(110vw,460px);margin:14px -16px 0;background:var(--sea);border-block:1px solid var(--line);position:relative}
.pmap .stat{position:absolute;left:12px;top:12px}
.regions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.regions div{font-size:11px;color:var(--sub)}
.regions div b{display:block;font:700 14px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif;color:var(--ink)}
.regions i{display:block;height:5px;border-radius:3px;background:var(--soft);margin-top:3px;overflow:hidden}.regions i u{display:block;height:100%}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:0 -16px}
.grid button{border:0;padding:0;aspect-ratio:1;background:var(--soft);position:relative;overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .vid{position:absolute;right:6px;top:6px;width:18px;height:18px;color:#fff;filter:drop-shadow(0 1px 2px #0008)}
.empty{text-align:center;padding:36px 20px;color:var(--sub)}
.empty h3{color:var(--ink);font:700 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif;margin:0 0 6px}
.set{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px;font-size:14px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.set label{white-space:nowrap}.set select{max-width:64%;white-space:normal;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);font-size:15px}
/* wish */
.wl{padding:8px 16px}
.wi{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wi img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.wi .t{flex:1}.wi .t b{display:block}.wi .t span{font-size:12px;color:var(--sub)}
.wi .done{font-size:12px;font-weight:700;color:#fff;background:#2fa86b;border-radius:999px;padding:3px 9px}
.wi button{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;min-height:40px}
h2.sec{font:700 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif;margin:16px 16px 4px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:#0007;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;border-radius:18px 18px 0 0;padding:6px 0 calc(16px + env(safe-area-inset-bottom))}
.grab{display:flex;align-items:center;padding:8px 16px}
.grab h3{margin:0;font:700 17px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif;flex:1}
.grab button{border:0;background:var(--soft);border-radius:50%;width:36px;height:36px;font-size:18px}
.pick{margin:8px 16px;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;display:block;cursor:pointer}
.pick b{display:block;font:700 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif;margin-bottom:4px}
.pick span{font-size:12px;color:var(--sub)}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.item{margin:10px 16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item .top{display:flex;gap:10px;padding:10px}
.item .top img{width:76px;height:76px;object-fit:cover;border-radius:10px;flex:none;background:var(--soft)}
.item .where{font-size:13px}.item .where b{display:block;font-size:15px}
.item .where .ng{color:var(--acc);font-weight:700}
.item .where button{margin-top:6px;border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.item .f{padding:0 10px 10px;display:grid;gap:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;min-height:36px}
.tags button.on{color:#fff;border-color:transparent}
.f input,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);font-size:16px}
.f textarea{min-height:60px;resize:vertical}
.savebar{padding:8px 16px}
.savebar .btn{width:100%}
.rgrid{padding:0 16px}
.toast{position:fixed;left:50%;bottom:calc(var(--navh,64px) + 16px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;width:max-content;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.confirm{display:flex;gap:8px;padding:8px 14px}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:70;font:700 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif;color:var(--sub)}
/* discover */
.search{position:sticky;top:57px;z-index:15;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sbox{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:0 12px}
.sbox svg{width:18px;height:18px;color:var(--sub);flex:none}
.sbox input{flex:1;border:0;background:none;padding:11px 0;font-size:16px;outline:none}
.sbox button{border:0;background:none;color:var(--sub);font-size:18px;width:32px;height:32px}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sugg button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;min-height:34px}
.here{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.here b{color:var(--ink)}
.here .lnk{border:0;background:none;color:var(--acc);font-weight:700;padding:6px 0;font-size:13px}
.here .seg{margin-left:auto}.here .seg button{font-size:12px;padding:4px 10px;min-height:30px}
.rescount{font-size:13px;color:var(--sub);padding:10px 16px 0}
.row2{display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.row2 .th{width:84px;height:84px;border-radius:12px;overflow:hidden;flex:none;border:0;padding:0;background:var(--soft)}
.row2 .th img{width:100%;height:100%;object-fit:cover;display:block}
.row2 .t{flex:1;display:grid;gap:2px;font-size:13px}
.row2 .t b{font-size:15px}
.row2 .t .s{color:var(--sub)}
.row2 .dist{font-weight:700;color:var(--acc)}
.gm{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;width:max-content;min-height:32px}
.gm svg{width:13px;height:13px;color:#2f8f4e}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub)}
.meta .dist{font-weight:700;color:var(--acc)}
.exp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.exp button{border:0;padding:0;aspect-ratio:1;position:relative;overflow:hidden;background:var(--soft)}
.exp button:nth-child(10n+3){grid-row:span 2;aspect-ratio:auto}
.exp img{width:100%;height:100%;object-fit:cover;display:block}
.exp span{position:absolute;left:6px;bottom:6px;right:6px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000a;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fol{border:0;background:var(--acc);color:#fff;border-radius:8px;font-size:12px;font-weight:700;padding:5px 10px;margin-left:auto;min-height:30px}
.fol.on{background:var(--soft);color:var(--ink)}
.hbtn{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.hbtn svg{width:24px;height:24px}
.world{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 14px;font-size:13px}
.world b{font:700 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif}.world span{color:var(--sub);margin-right:4px}.world em{color:var(--sub);font-style:normal;font-size:12px}
.world button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;min-height:34px}
.myhead{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:14px 0 10px}
.myhead h3{margin:0;font:700 17px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif}.myhead small{font:400 12px "Noto Sans JP";color:var(--sub);margin-left:4px}
.myhead .seg{margin-left:auto}
h4.grp{font:700 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,"Noto Sans JP",sans-serif;margin:14px 0 4px;display:flex;align-items:baseline;gap:8px}h4.grp small{font:400 12px "Noto Sans JP";color:var(--sub)}
.pgrp{margin:6px 0 12px}.pgrp b{font-size:14px}.pgrp b small{color:var(--sub);font-weight:400}
.strip{display:flex;gap:4px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
.strip button{flex:none;width:96px;height:96px;border:0;padding:0;border-radius:10px;overflow:hidden;position:relative;background:var(--soft)}.strip img{width:100%;height:100%;object-fit:cover;display:block}

<script>
{

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem('irodori.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('irodori.'+k,JSON.stringify(v))}catch{}}};
const ICON={fav:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',album:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 7h13v13H4zM7 4h13v13"/><path fill="none" stroke="currentColor" stroke-width="2" d="M4 16l4-4 3 3 2-2 4 4"/></svg>',pin:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
heart:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 20s-7-4.4-9.2-9C1.4 7.8 3.5 4.5 6.8 4.5c2.1 0 3.4 1.2 5.2 3.2 1.8-2 3.1-3.2 5.2-3.2 3.3 0 5.4 3.3 4 6.5C19 15.6 12 20 12 20z"/></svg>',
cmt:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 5h16v11H9l-5 4z"/></svg>',
wish:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6 3h12v18l-6-4-6 4z"/></svg>',
map:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>',
vid:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 5h11a1 1 0 0 1 1 1v3l4-3v12l-4-3v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>'};

/* ---------- 地方と色 ---------- */
const REG=[['北海道',1,1,'#4fb3e8'],['東北',2,7,'#5cc48f'],['関東',8,14,'#f6c344'],['中部',15,23,'#ff9a4d'],['近畿',24,30,'#f0627e'],['中国',31,35,'#a77de0'],['四国',36,39,'#36bfc0'],['九州沖縄',40,47,'#ff5a3c']];
const CONT=[['アジア','#ffb02e'],['ヨーロッパ','#4f7be8'],['アフリカ','#d98a3a'],['北アメリカ','#3fb98a'],['南アメリカ','#9b6be0'],['オセアニア','#2bb5c9']];
function contOfLL([lon,lat]){if(lon<-150||lon>160&&lat<0)return 5;if(lon<-30)return lat>7.5?3:4;if(lon>110&&lat<-10||lon>130&&lat<0)return 5;if(lat>=35&&lon<45)return 1;if(lat<35&&lon<52&&!(lon>34&&lat>12))return 2;return 0}
const regOf=pc=>{const n=+pc;return REG.findIndex(r=>n>=r[1]&&n<=r[2])};
const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
function shade(hex,code){const n=parseInt(hex.slice(1),16);const d=(hash(code)%36)-18;const f=v=>Math.max(0,Math.min(255,v+d));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
const fillFor=(pc,code)=>shade(REG[regOf(pc)][3],code);
const cFill=cc=>{const f=countryById[cc];return f?shade(CONT[f.cont][1],cc):'#999'};
const postFill=p=>p.mc?fillFor(p.pc,p.mc):cFill(p.cc);

const TAGS=[['美味しかった','#ff8a3d'],['綺麗だった','#3aa8e0'],['楽しかった','#e0569b'],['また行きたい','#2fa86b']];
const CATS=[['spot','スポット','#3a8fd6'],['food','グルメ','#e8742c'],['event','イベント','#8a5cd6'],['active','アクティブ','#d64f7a'],['stay','ステイ','#2a9d8f']];
const catOf=p=>p.cat||(p.tag==='美味しかった'||/ラーメン|うどん|屋台|食|カフェ|丼|焼き|小籠包|ジンギスカン/.test(p.place||'')?'food':'spot');
const catName=c=>(CATS.find(x=>x[0]===c)||CATS[0])[1],catColor=c=>(CATS.find(x=>x[0]===c)||CATS[0])[2];
const catChip=p=>`<span class="cat" style="color:${catColor(catOf(p))};border-color:${catColor(catOf(p))}55">${catName(catOf(p))}</span>`;
const catSeg=(act,cur)=>`<div class="seg catseg" role="group" aria-label="種類">${[['all','全て'],...CATS].map(c=>`<button data-act="${act}" data-c="${c[0]}" class="${cur===c[0]?'on':''}">${c[1]}</button>`).join('')}</div>`;
const tagColor=t=>(TAGS.find(x=>x[0]===t)||['', '#888'])[1];

/* ---------- サンプル画像（SVGの風景） ---------- */
function scene(kind,seed){
  const r=n=>{seed=(seed*9301+49297)%233280;return seed/233280*n};
  let s='';
  if(kind==='sea')s=`<defs><linearGradient id="a" x2="0" y2="1"><stop offset="0" stop-color="#7cc8f2"/><stop offset="1" stop-color="#ffe9c4"/></linearGradient><linearGradient id="b" x2="0" y2="1"><stop offset="0" stop-color="#1e94c4"/><stop offset="1" stop-color="#0a5579"/></linearGradient></defs><rect width="600" height="600" fill="url(#a)"/><circle cx="${380+r(120)}" cy="250" r="54" fill="#fff4d6"/><rect y="330" width="600" height="270" fill="url(#b)"/>${[...Array(9)].map((_,i)=>`<path d="M${r(500)} ${360+i*26} q30 -8 60 0" stroke="#bfe9ff" stroke-width="4" fill="none" opacity=".6"/>`).join('')}<path d="M60 330 l70 -110 l40 40 l50 -20 l30 90z" fill="#3c4f5c"/><path d="M60 330 l70 -110 l20 30 l-40 80z" fill="#566b78"/>`;
  else if(kind==='mountain')s=`<defs><linearGradient id="a" x2="0" y2="1"><stop offset="0" stop-color="#a9dcff"/><stop offset="1" stop-color="#f4fbff"/></linearGradient></defs><rect width="600" height="600" fill="url(#a)"/><path d="M-20 440 L180 170 L300 330 L410 210 L640 460 V600 H-20z" fill="#5f8fb0"/><path d="M180 170 L225 232 L200 222 L175 240 L150 212z" fill="#fff"/><path d="M-20 600 V430 Q150 360 300 420 T640 410 V600z" fill="#3f9a63"/><path d="M-20 600 V500 Q200 440 640 520 V600z" fill="#2c7a4b"/>${[...Array(7)].map(()=>{const x=r(600),y=470+r(80);return `<path d="M${x} ${y} l14 -40 l14 40z" fill="#1f5e39"/>`}).join('')}`;
  else if(kind==='night')s=`<defs><linearGradient id="a" x2="0" y2="1"><stop offset="0" stop-color="#0c1838"/><stop offset="1" stop-color="#433071"/></linearGradient></defs><rect width="600" height="600" fill="url(#a)"/>${[...Array(40)].map(()=>`<circle cx="${r(600)}" cy="${r(300)}" r="${r(2)+.5}" fill="#fff" opacity="${r(.8)+.2}"/>`).join('')}<circle cx="470" cy="110" r="36" fill="#fff6d8"/>${[...Array(14)].map((_,i)=>{const w=40+r(30),h=90+r(220),x=i*44-10;let win='';for(let k=0;k<14;k++)win+=`<rect x="${x+6+r(w-14)}" y="${600-h+10+r(h-20)}" width="6" height="8" fill="#ffd36b" opacity="${r(1)}"/>`;return `<rect x="${x}" y="${600-h}" width="${w}" height="${h}" fill="#1a1d3a"/>${win}`}).join('')}`;
  else if(kind==='food')s=`<rect width="600" height="600" fill="#e9c79a"/><rect width="600" height="600" fill="#d9ae79" opacity=".4" transform="skewY(-8)"/><ellipse cx="300" cy="330" rx="230" ry="200" fill="#2b2b2b"/><ellipse cx="300" cy="320" rx="200" ry="170" fill="#f0b85e"/>${[...Array(12)].map((_,i)=>`<path d="M${150+i*25} 300 q40 ${20+r(30)} 80 0" stroke="#fde7a2" stroke-width="7" fill="none"/>`).join('')}<ellipse cx="380" cy="270" rx="44" ry="34" fill="#fff"/><ellipse cx="384" cy="272" rx="20" ry="16" fill="#ffb21f"/><path d="M200 230 h90 v40 h-90z" fill="#c9603e" transform="rotate(-12 245 250)"/>${[...Array(14)].map(()=>`<circle cx="${220+r(160)}" cy="${330+r(90)}" r="7" fill="#5bb84a"/>`).join('')}<rect x="470" y="40" width="12" height="300" rx="6" fill="#a46b3a" transform="rotate(20 476 190)"/><rect x="495" y="40" width="12" height="300" rx="6" fill="#a46b3a" transform="rotate(22 501 190)"/>`;
  else if(kind==='temple')s=`<defs><linearGradient id="a" x2="0" y2="1"><stop offset="0" stop-color="#ffd8b5"/><stop offset="1" stop-color="#fff3e6"/></linearGradient></defs><rect width="600" height="600" fill="url(#a)"/><path d="M0 600 V470 H600 V600z" fill="#c9b79f"/>${[0,1,2,3].map(i=>{const k=1-i*.18,cx=300,w=360*k,y=120+i*70,h=380*k;return `<g opacity="${1-i*.12}"><rect x="${cx-w/2}" y="${y}" width="${w}" height="${30*k}" rx="6" fill="#d8381e"/><rect x="${cx-w/2+20*k}" y="${y+50*k}" width="${w-40*k}" height="${18*k}" fill="#d8381e"/><rect x="${cx-w/2+40*k}" y="${y+20*k}" width="${22*k}" height="${h}" fill="#e34324"/><rect x="${cx+w/2-62*k}" y="${y+20*k}" width="${22*k}" height="${h}" fill="#e34324"/><rect x="${cx-w/2-8}" y="${y-8*k}" width="${w+16}" height="${14*k}" rx="7" fill="#2a2a2a"/></g>`}).reverse().join('')}`;
  else s=`<rect width="600" height="600" fill="#ffcf8a"/><circle cx="300" cy="300" r="200" fill="#ff8f5c"/>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">${s}</svg>`);
}

const me=Object.assign({id:'me',name:'わたし',handle:'@me',c1:'#ff5a3c',c2:'#f6c344'},ls.get('me',{}));
const USERS=[me,
 {id:'yuki',name:'ゆうき',handle:'@yuki_trip',c1:'#4fb3e8',c2:'#5cc48f',bio:'夜景と海が好き。週末はだいたいドライブ'},

let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('irodori',1);r.onupgradeneeded=()=>r.result.createObjectStore('posts',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function dbAll(){try{const d=await db();return await new Promise((res,rej)=>{const q=d.transaction('posts').objectStore('posts').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch{return []}}
async function dbPutRaw(p){try{const d=await db();await new Promise((res,rej)=>{const t=d.transaction('posts','readwrite');t.objectStore('posts').put(p);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch{}}
async function dbDelRaw(id){try{const d=await db();await new Promise((res)=>{const t=d.transaction('posts','readwrite');t.objectStore('posts').delete(id);t.oncomplete=res;t.onerror=res})}catch{}}

async function dbPut(p){if(!p.remote)await dbPutRaw(p);if(typeof cloudPush==='function')cloudPush(p)}
async function dbDel(id){await dbDelRaw(id);if(typeof cloudDelete==='function')cloudDelete(id)}

d spots", "장소 추가", "添加地点"], "アルバムを更新": ["Update album", "앨범 업데이트", "更新相册"], "まだの場所をGoogleマップで回る": ["Visit remaining places in Google Maps", "남은 장소를 구글 지도로 돌기", "用谷歌地图走完剩余地点"], "まだの場所をAppleマップで回る": ["Visit remaining places in Apple Maps", "남은 장소를 애플 지도로 돌기", "用苹果地图走完剩余地点"], "まだの場所をNAVER Mapで回る": ["Visit remaining places in NAVER Map", "남은 장소를 네이버 지도로 돌기", "用NAVER地图走完剩余地点"], "スタンプ": ["Stamp", "스탬프", "盖章"], "＋写真": ["+Photo", "+사진", "+照片"], "済": ["Done", "완료", "完成"], "番号の丸を押すと、その場所の写真を追加できます。追加した写真は思い出としても投稿されます。": ["Tap a numbered circle to add a photo for that place. It's also posted as a memory.", "번호 동그라미를 누르면 그 장소 사진을 추가할 수 있어요. 추가한 사진은 추억으로도 올라가요.", "点编号圆圈可为该地点添加照片，照片也会作为回忆发布。"], "最大10か所までの道案内を作ります。": ["Creates directions for up to 10 places.", "최대 10곳까지 길안내를 만들어요.", "最多为10个地点生成导航。"], "いってらっしゃい！現地で写真を撮るとスタンプが押されます": ["Have a great trip! Taking photos on site adds stamps", "잘 다녀오세요! 현지에서 사진을 찍으면 스탬프가 찍혀요", "一路顺风！在当地拍照就会盖章"], "おかえりなさい！旅の記録として残しました": ["Welcome back! Saved as a trip record", "어서 오세요! 여행 기록으로 남겼어요", "欢迎回来！已保存为旅行记录"], "候補地を1か所以上追加してください": ["Add at least one candidate", "후보지를 한 곳 이상 추가하세요", "请至少添加一个候选地"], "候補に追加しました": ["Added as candidate", "후보에 추가했습니다", "已添加为候选"], "スタンプを押しました": ["Stamped", "스탬프를 찍었습니다", "已盖章"], "全部集まりました！おめでとう": ["All collected! Congrats", "모두 모았어요! 축하해요", "全部集齐！恭喜"], "全部の場所の写真がそろいました！": ["Photos for every place are in!", "모든 장소의 사진이 모였어요!", "所有地点的照片都齐了！"], "まだ写真がありません。番号の丸を押して写真を追加してください": ["No photos yet. Tap a numbered circle to add one", "아직 사진이 없어요. 번호 동그라미를 눌러 추가하세요", "还没有照片，请点编号圆圈添加"], "旅を共有": ["Share trip", "여행 공유", "分享旅行"], "LINEで旅のしおりを送る": ["Send the trip via LINE", "LINE으로 여행 일정 보내기", "通过LINE发送行程"], "試作版では、送った相手のアプリにはまだ中身が届きません。": ["In this prototype, the content doesn't reach the recipient's app yet.", "시제품에서는 받는 사람 앱에 아직 내용이 전달되지 않아요.", "试用版中内容尚不会送达对方应用。"], "旅を削除しました（思い出の投稿は消えません）": ["Trip deleted (memory posts remain)", "여행을 삭제했어요 (추억 게시물은 남아요)", "已删除旅行（回忆帖子保留）"], "追加する": ["Add", "추가하기", "添加"], "場所の名前（例：〇〇水族館）": ["Place na function trPlace(s){

  const sp=s.indexOf(' ');const head=sp<0?s:s.slice(0,sp);const p=I18N_P[head];
  return p?p[LI()]+(sp<0?'':s.slice(sp)):null;
}
const DATE_RX=/（(\d+)泊(\d+)日）|（日帰り）|〜/g;
function T(s){
  if(s==null)return s;const lang=curLang();if(lang==='ja')return s;
  const c=trCache[lang]||(trCache[lang]=new Map());if(c.has(s))return c.get(s);
  let out=trCore(s);if(out==null)out=s;c.set(s,out);return out;
}
function trCore(s){
  if(!/[\u3000-\u30ff\u3400-\u9fff\uff01-\uff60]/.test(s))return s;
  const m0=s.match(/^(\s*)([\s\S]*?)(\s*)$/);const lead=m0[1],core=m0[2],tail=m0[3];
  if(core!==s){const r=T(core);return r===core?null:lead+r+tail}
  if(I18N_D.has(s))return I18N_D.get(s)[LI()];
  if(s.includes(' · ')){const parts=s.split(' · ').map(x=>T(x));return parts.join(' · ')}
  if(/^·\s/.test(s))return '· '+T(s.replace(/^·\s+/,''));
  for(const [rx,f] of I18N_RX){const m=s.match(rx);if(m){const r=f(m);if(r!=null)return r}}
  const pl=trPlace(s);if(pl)return pl;
  if(/\d+\/\d+/.test(s)&&/（\d+泊\d+日）|（日帰り）|〜/.test(s)){DATE_RX.lastIndex=0;return s.replace(DATE_RX,(x,a,b)=>x==='〜'?(curLang()==='en'?'–':'~'):x==='（日帰り）'?L3(' (day trip)',' (당일치기)','（一日游）'):L3(` (${a} night${a==='1'?'':'s'})`,` (${a}박 ${b}일)`,`（${a}晚${b}天）`))}
  return null;
}

function trNode(n){
  if(n.nodeType===3){const pe=n.parentNode;if(!pe||SKIP_TR.has(pe.nodeName)||pe.closest&&pe.closest('[translate=no]'))return;
    const v=n.nodeValue;if(n.__tr!==undefined&&v===n.__tr){}else{n.__ja=v}

let MF=[],PF=[],CF=[],countryById={},JP=null,projection,pathGen,mD=[],pbD='',muniByCode={},prefName={},muniCount={};
async function loadGeo(){
  const [mt,pt,wt]=await Promise.all([fetch('munis.json').then(r=>r.json()),fetch('prefs.json').then(r=>r.json()),fetch('world.json').then(r=>r.json())]);
  MF=L.feature(mt,mt.objects.m).features;PF=L.feature(pt,pt.objects.prefectures).features;CF=L.feature(wt,wt.objects.countries).features.filter(f=>f.id!=='010');
  projection=L.geoMercator().fitExtent([[0,230],[800,770]],{type:'MultiPoint',coordinates:[[-180,-56],[180,78]]});
  pathGen=L.geoPath(projection);
  for(const f of CF){f.cont=contOfLL(L.geoCentroid(f));f.d=pathGen(f)||'';f.cen=pathGen.centroid(f);if(!countryById[f.id])countryById[f.id]=f}
  JP=countryById['392'];
  for(const f of MF){const c=f.properties.c,pc=c.slice(0,2);f.pc=pc;muniByCode[c]=f;muniCount[pc]=(muniCount[pc]||0)+1;f.d=pathGen(f)||'';f.cen=pathGen.centroid(f)}
  for(const f of PF){prefName[f.properties.c]=f.properties.n}
  pbD=pathGen(L.mesh(pt,pt.objects.prefectures,(a,b)=>a!==b));
}
function hit(list,pt){const f=list.find(f=>L.geoContains(f,pt));if(f)return f;for(const r of [0.03,0.08,0.15,0.3,0.6]){for(let a=0;a<16;a++){const q=[pt[0]+r*Math.cos(a*Math.PI/8)/Math.cos(pt[1]*Math.PI/180),pt[1]+r*Math.sin(a*Math.PI/8)];const g=list.find(f=>L.geoContains(f,q));if(g)return g}}return null}
function locate(lon,lat){
  const pt=[lon,lat];
  const inJP=lon>122&&lon<154&&lat>20&&lat<46.5;
  const pf=inJP?hit(PF,pt):null;
  if(pf){const m=hit(MF.filter(f=>f.pc===pf.properties.c),pt);if(m)return {mc:m.properties.c,pc:m.pc,cc:'392'}}
  const c=hit(CF,pt);
  if(c&&c.id!=='392')return {cc:c.id};
  if(c||inJP){const m=hit(MF,pt);if(m)return {mc:m.properties.c,pc:m.pc,cc:'392'}}
  return null;
}

/* 中国国内は地図アプリがGCJ-02座標のため、WGS84から変換して渡す（高德地图用。百度はcoord_type=wgs84を指定） */
function inChina(lat,lon){return lon>73.5&&lon<135.1&&lat>18&&lat<53.6&&!(lon>119.9&&lat<25.4&&lon<122.1)&&!(lon>124&&lat>33&&lat<43.5)}
function toGCJ(lat,lon){if(!inChina(lat,lon))return[lat,lon];const A=6378245,EE=0.00669342162296594323,PI=Math.PI,x=lon-105,y=lat-35;
 let dLat=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3+(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3+(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;
 let dLon=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3+(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3+(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;
 const r=lat/180*PI;let m=Math.sin(r);m=1-EE*m*m;const sm=Math.sqrt(m);dLat=dLat*180/((A*(1-EE))/(m*sm)*PI);dLon=dLon*180/(A/sm*Math.cos(r)*PI);return[lat+dLat,lon+dLon]}

 switch(a){

function nameSugg(q,i){
  if(q.busy||q.lat==null)return '';
  const near=posts.filter(p=>canSee(p)&&p.lat!=null&&p.place).map(p=>({p,d:distKm.call(null,p,{lat:q.lat,lon:q.lon})})).filter(x=>x.d<0.6).sort((a,b)=>a.d-b.d);
  const seen=new Set(),list=[];for(const x of near){if(seen.has(x.p.place))continue;seen.add(x.p.place);list.push(x);if(list.length>=4)break}
  return `<div class="names">${list.length?'近くの思い出から：'+list.map(x=>`<button data-act="pickname" data-i="${i}" data-id="${x.p.id}">${esc(x.p.place)}</button>`).join(''):''}<a href="https://www.google.com/maps/search/?api=1&query=${q.lat.toFixed(6)},${q.lon.toFixed(6)}" target="_blank" rel="noopener">この場所のお店をGoogleマップで確認</a></div>`;
}

async function thumbImage(file){try{const bmp=await createImageBitmap(file);const s=Math.min(1,1080/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}catch{return null}}
function thumbVideo(file){return new Promise(res=>{const v=document.createElement('video');const u=URL.createObjectURL(file);let done=false;
  const fin=x=>{if(done)return;done=true;try{v.pause()}catch{}v.removeAttribute('src');try{v.load()}catch{}URL.revokeObjectURL(u);v.remove();res(x)};
  const grab=()=>{try{if(!v.videoWidth)return false;const s=Math.min(1,1080/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);const g=c.getContext('2d');g.drawImage(v,0,0,c.width,c.height);
    const d=g.getImageData(0,0,c.width,c.height).data;let sum=0;for(let k=0;k<d.length;k+=400)sum+=d[k]+d[k+1]+d[k+2];if(sum<8*(d.length/400))return false;fin(c.toDataURL('image/jpeg',.8));return true}catch{return false}};
  v.muted=true;v.defaultMuted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='auto';
  v.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';document.body.appendChild(v);
  let tries=0;const seekTo=[0.1,0.5,1.2];
  v.onloadedmetadata=()=>{try{v.currentTime=Math.min(seekTo[0],(v.duration||1)/2)}catch{}};
  v.onseeked=()=>{if(grab())return;tries++;if(tries<seekTo.length){try{v.currentTime=Math.min(seekTo[tries],(v.duration||2)*.9)}catch{}}else{const p=v.play();if(p&&p.catch)p.catch(()=>{})}};
  v.ontimeupdate=()=>{if(v.currentTime>0.05)grab()};
  v.onerror=()=>fin(null);setTimeout(()=>fin(null),8000);v.src=u;try{v.load()}catch{}})}
async function videoGPS(file){
  const re=/([+-]\d{1,2}\.\d{2,})([+-]\d{1,3}\.\d{2,})/;const N=4*1024*1024;
  for(const part of [file.slice(0,N),file.slice(Math.max(0,file.size-N))]){try{const txt=new TextDecoder('latin1').decode(await part.arrayBuffer());const m=txt.match(re);if(m){const lat=+m[1],lon=+m[2];if(Math.abs(lat)<=90&&Math.abs(lon)<=180)return {latitude:lat,longitude:lon}}}catch{}}
  return null;
}
async function addFiles(files){
  for(const file of files){
    const isV=file.type.startsWith('video');const q={file,kind:isV?'video':'photo',busy:true,tag:'',place:'',comment:''};queue.push(q);renderItems();
    let gps=null,taken=null;
    if(isV){gps=await videoGPS(file);q.img=await thumbVideo(file);taken=file.lastModified}
    else{try{gps=await L.exifr.gps(file)}catch{}try{const ex=await L.exifr.parse(file,{tiff:true,exif:true,gps:false});const dt=ex&&(ex.DateTimeOriginal||ex.CreateDate||ex.ModifyDate);if(dt)taken=+new Date(dt)}catch{}q.img=await thumbImage(file);if(!taken)taken=file.lastModified}
    if(gps&&isFinite(gps.latitude)&&isFinite(gps.longitude)){q.lat=gps.latitude;q.lon=gps.longitude;const r=locate(q.lon,q.lat);if(r){Object.assign(q,r);q.src=isV?'video':'exif'}}
    q.takenAt=taken;q.busy=false;renderItems();
  }
}
async function saveAll(){
  const key=p=>p.mc||'c'+p.cc;const wishM={};S.wish.forEach(id=>{const p=posts.find(x=>x.id===id);if(p)wishM[key(p)]=p});
  let n=0,missing=0,credited=[];const newOnes=[];
  for(const q of queue){if(q.busy)continue;if(!q.mc&&!q.cc){missing++;continue}
    const p={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),uid:'me',lat:q.lat,lon:q.lon,mc:q.mc,pc:q.pc,cc:q.cc,place:q.place.trim()||muniName(q.mc)||cName(q.cc),tag:q.tag||'また行きたい',comment:q.comment.trim(),img:q.img,kind:q.kind,ts:Date.now()+n,takenAt:q.takenAt,vis:q.vis||S.defvis,cat:q.cat||'spot'};
    if(q.kind==='video'&&q.file.size<60*1024*1024)p.blob=q.file;
    const w=wishM[key(q)];if(w&&!posts.some(x=>x.uid==='me'&&x.via===w.uid&&key(x)===key(q))){p.via=w.uid;credited.push(U(w.uid).name)}
    posts.push(p);newOnes.push(p);await dbPut(p);n++}
  queue=queue.filter(q=>(!q.mc&&!q.cc)||q.busy);
  if(!n){toast(missing?'場所が決まっていない思い出があります':'投稿する写真を選んでください');return}
  const got=stampCheck(newOnes);
  closeSheet();S.mapUser='me';renderAll();show('map');mainMap.fitUser('me');
  if(got.length){const t=got[0].t;setTimeout(()=>{S.planTab='trip';openTrip(t.id)},300);toast(`スタンプゲット！「${got.map(g=>g.sp.name).join('」「')}」（${t.name}）`);return}
  toast(credited.length?`${credited[0]}さんに「おすすめで来たよ」を送る予定です（試作では通知は送られません）`:`${n}件投稿して地図を塗りました`);
}

async function addPhotoToSpot(tid,sid,file){
  const t=S.trips.find(x=>x.id===tid);const sp=t&&t.spots.find(x=>x.id===sid);if(!sp)return;toast('写真を読み込んでいます…');
  const isV=file.type.startsWith('video');let gps=null,taken=null,img=null;
  if(isV){gps=await videoGPS(file);img=await thumbVideo(file);taken=file.lastModified}
  else{try{gps=await L.exifr.gps(file)}catch{}try{const ex=await L.exifr.parse(file,{tiff:true,exif:true,gps:false});const dt=ex&&(ex.DateTimeOriginal||ex.CreateDate);if(dt)taken=+new Date(dt)}catch{}img=await thumbImage(file);if(!taken)taken=file.lastModified}
  let lat=sp.lat,lon=sp.lon;if(gps&&isFinite(gps.latitude)&&(sp.lat==null||distKm({lat:gps.latitude,lon:gps.longitude},{lat:sp.lat,lon:sp.lon})<3)){lat=gps.latitude;lon=gps.longitude}
  const r=lat!=null?(locate(lon,lat)||{}):{mc:sp.mc,pc:sp.pc,cc:sp.cc};
  const p={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),uid:'me',lat,lon,...r,place:sp.name,tag:'楽しかった',comment:'',img,kind:isV?'video':'photo',ts:Date.now(),takenAt:taken,vis:t.vis==='me'?'me':(t.vis||S.defvis),cat:sp.cat};
  if(isV&&file.size<60*1024*1024)p.blob=file;
  posts.push(p);await dbPut(p);sp.done={post:p.id,at:Date.now()};saveTrips();stampCheck([p]);
  const lal=S.albums.find(x=>x.id===t.albumId);if(lal&&!lal.items.includes(p.id)){lal.items.push(p.id);saveAlbums()}
  openTrip(tid);renderAll();toast(tripDone(t)?'全部の場所の写真がそろいました！':'「'+sp.name+'」に写真を追加しました');
}

  if(!t.startedAt)return '';const y=new Date(t.startedAt).getFullYear();const yr=y!==new Date().getFullYear()?y+'年 ':'';return yr+md(t.startedAt)+'〜'+(t.endedAt?md(t.endedAt):'')}

/* ---------- アイコンを写真から作る（丸く切り抜き・ドラッグで位置、スライダーで拡大） ---------- */
const ICON_CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function openAvatarEditor(file){
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const st={x:0,y:0,z:1};
    openSheet('アイコンを作る',`<p class="note" style="text-align:center;padding-top:0">ドラッグで位置、スライダーで大きさを調整できます</p><div class="avcrop" id="avCrop"><img decoding="async" id="avImg" src="${url}" alt=""></div><div class="avzoom"><span>－</span><input type="range" id="avZ" min="1" max="4" step="0.01" value="1" aria-label="拡大"><span>＋</span></div><div class="btnrow" style="padding:0 16px">${S.avatar?'<button class="btn" data-act="avclear">元に戻す</button>':''}<button class="btn pri" data-act="avsave">このアイコンにする</button></div>`);
    const box=$('#avCrop'),img=$('#avImg'),W=()=>box.clientWidth;
    const base=()=>W()/Math.min(im.naturalWidth,im.naturalHeight);
    const clamp=()=>{const s=base()*st.z,mx=Math.max(0,(im.naturalWidth*s-W())/2),my=Math.max(0,(im.naturalHeight*s-W())/2);st.x=Math.max(-mx,Math.min(mx,st.x));st.y=Math.max(-my,Math.min(my,st.y))};
    const draw=()=>{clamp();const s=base()*st.z;img.style.width=im.naturalWidth*s+'px';img.style.height=im.naturalHeight*s+'px';img.style.transform=`translate(calc(-50% + ${st.x}px),calc(-50% + ${st.y}px))`};
    draw();let drag=null;
    box.addEventListener('pointerdown',e=>{drag={x:e.clientX-st.x,y:e.clientY-st.y};box.setPointerCapture(e.pointerId)});
    box.addEventListener('pointermove',e=>{if(!drag)return;st.x=e.clientX-drag.x;st.y=e.clientY-drag.y;draw()});
    box.addEventListener('pointerup',()=>drag=null);box.addEventListener('pointercancel',()=>drag=null);
    $('#avZ').addEventListener('input',e=>{st.z=+e.target.value;draw()});
    openAvatarEditor.save=()=>{const N=256,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');const s=base()*st.z,k=N/W();
      g.fillStyle='#fff';g.fillRect(0,0,N,N);const w=im.naturalWidth*s*k,hh=im.naturalHeight*s*k;g.drawImage(im,(N-w)/2+st.x*k,(N-hh)/2+st.y*k,w,hh);
      S.avatar=c.toDataURL('image/jpeg',0.86);ls.set('avatar',S.avatar);cloudAvatar(S.avatar);URL.revokeObjectURL(url);closeSheet();renderAll();toast('アイコンを変えました')};
  };
  im.onerror=()=>toast('画像を読み込めませんでした');im.src=url;
}

/* ---------- お知らせ・思い出 ---------- */
function notifs(){
  const out=[],today=new Date(),mine=posts.filter(p=>p.uid==='me');
  for(const p of mine){const d=new Date(p.takenAt||p.ts);const yrs=today.getFullYear()-d.getFullYear();if(yrs<1)continue;const t=new Date(today.getFullYear(),d.getMonth(),d.getDate());const diff=Math.round((t-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/D);if(Math.abs(diff)<=3)out.push({id:'otd-'+p.id+'-'+today.getFullYear(),kind:'otd',p,text:`${yrs}年前の${diff===0?'今日':diff<0?Math.abs(diff)+'日前':diff+'日後'}、${p.place}に行きました`,ts:now+1})}
  if(S.here){const mineK=new Set(mine.map(p=>p.mc||'c'+p.cc));for(const id of S.wish){const p=posts.find(x=>x.id===id);if(!p||mineK.has(p.mc||'c'+p.cc))continue;const d=distKm(p);if(d!=null&&d<15)out.push({id:'near-'+p.id,kind:'near',p,text:`近くに行きたいリストの「${p.place}」があります（${fmtKm(d)}）`,ts:now})}}
  for(const fp of posts.filter(p=>p.uid!=='me'&&canSee(p)&&p.mc)){const m=mine.filter(x=>x.mc===fp.mc&&(x.takenAt||x.ts)<fp.ts)[0];if(m)out.push({id:'fv-'+fp.id,kind:'fv',p:fp,text:`${U(fp.uid).name}さんが、あなたも行った${muniName(fp.mc)}に行きました（${fp.place}）`,ts:fp.ts})}
  for(const fp of posts.filter(p=>p.uid!=='me'&&canSee(p)&&p.via==='me'))out.push({id:'via-'+fp.id,kind:'via',p:fp,text:`${U(fp.uid).name}さんが、あなたのおすすめで${fp.place}に行きました`,ts:fp.ts});
  return out.filter(x=>S.notif[x.kind]!==false).sort((a,b)=>b.ts-a.ts);
}

/* ---------- 詳しい地図（MapLibre＋自前の地図ファイル） ----------

   地図ファイルに届かない環境（Claudeの試作画面など）では、今までの白地図（SVG）に自動で切り替える。 */
const GL_HOME_Z=13.9,GL_PHOTO_Z=15.2;/* 最初の表示＝駅2つ分くらい、写真ピン＝駅前の数ブロックくらい */
const GL_TILES='https://pub-dc41bcd297834b5ca757a907600e7773.r2.dev/japan.pmtiles';
async function glAvailable(){
  if(!window.maplibregl||!window.pmtiles||!window.basemaps)return false;
  try{const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),4000);
    const r=await fetch(GL_TILES,{headers:{Range:'bytes=0-15'},signal:ac.signal});clearTimeout(tm);
    if(!(r.ok||r.status===206))return false;const b=new Uint8Array(await r.arrayBuffer());return b[0]===0x50&&b[1]===0x4d}catch{return false}}
function glStyle(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark'||(S.themeSet==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  const flavor=dark?'dark':'light';const lang={ja:'ja',en:'en',ko:'ko',zh:'zh-Hans'}[curLang()]||'ja';
  const layers=basemaps.layers('protomaps',basemaps.namedFlavor(flavor),{lang});

  return {version:8,glyphs:'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',sprite:'https://protomaps.github.io/basemaps-assets/sprites/v4/'+flavor,
    sources:{protomaps:{type:'vector',url:'pmtiles://'+GL_TILES,attribution:'© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>'}},layers}}
function makeGLMap(el,{onTap}={}){
  if(!makeGLMap.proto){makeGLMap.proto=new pmtiles.Protocol();maplibregl.addProtocol('pmtiles',makeGLMap.proto.tile)}
  el.hidden=false;
  const map=window.__glmap=new maplibregl.Map({container:el,style:glStyle(),center:[139.7,35.7],zoom:4,maxZoom:19,attributionControl:{compact:true},dragRotate:false,pitchWithRotate:false});
  map.touchZoomRotate.disableRotation();
  const toLL=([x,y])=>projection.invert([x,y]);

    d.innerHTML=`<svg width="${80*s}" height="${84*s}" viewBox="-40 -80 80 84" overflow="visible">${pinSVG(p,0,0,opt)}</svg>`;
    d.addEventListener('click',e=>{if(!e.target.closest('.pin'))return;e.stopPropagation();if(picking==null)openPost(p.id)});return d}
  function drawPins(){markers.forEach(m=>m.remove());markers=[];photo=isPhoto();
    const list=lastMine.filter(p=>p.lat!=null&&(!S.pinCat||catOf(p)===S.pinCat));
    const wl=S.wish.map(id=>posts.find(p=>p.id===id)).filter(p=>p&&p.lat!=null&&!lastMine.includes(p)&&canSee(p)&&(!S.pinCat||catOf(p)===S.pinCat));
    const add=(p,opt)=>{markers.push(new maplibregl.Marker({element:pinEl(p,opt),anchor:'bottom',offset:[0,4*(opt.big?1.3:1)]}).setLngLat([p.lon,p.lat]).addTo(map))};
    wl.forEach(p=>add(p,{wish:true,big:S.focus===p,photo}));
    [...list].sort((a,b)=>b.lat-a.lat).forEach(p=>add(p,{ring:lastG?U(p.uid).c1:null,big:S.focus===p,photo}));
    if(S.focus&&!lastMine.includes(S.focus)&&!wl.includes(S.focus)&&S.focus.lat!=null)add(S.focus,{big:true,photo})}
  map.on('zoomend',()=>{if(isPhoto()!==photo)drawPins()});
  map.on('click',e=>{if(!onTap)return;const {lng,lat}=e.lngLat;const base=projection([lng,lat]);const r=locate(lng,lat);
    const f=r?(r.mc?muniByCode[r.mc]:countryById[r.cc]):null;onTap(f,base)});
  let first=true;

    map.fitBounds([[Math.min(a[0],b[0]),Math.min(a[1],b[1])],[Math.max(a[0],b[0]),Math.max(a[1],b[1])]],{padding:40,duration:first?0:900,maxZoom:17});first=false}
  function fitUser(uid){const fs=(Array.isArray(uid)?uid:ofUser(uid)).filter(p=>p.mc||p.cc).flatMap(p=>!p.mc?[countryById[p.cc]]:S.mode==='pref'?MF.filter(f=>f.pc===p.pc):[muniByCode[p.mc]]).filter(Boolean);
    if(!fs.length){fit(pathGen.bounds(JP));return}let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const f of fs){const b=pathGen.bounds(f);x0=Math.min(x0,b[0][0]);y0=Math.min(y0,b[0][1]);x1=Math.max(x1,b[1][0]);y1=Math.max(y1,b[1][1])}fit([[x0,y0],[x1,y1]])}
  function paint(uid){const isL=Array.isArray(uid);lastMine=(isL?uid:ofUser(uid)).filter(p=>p.mc||p.cc);lastG=!isL&&String(uid).startsWith('g:');drawPins();return {}}
  let hereMk=null;
  function setHere(hh){if(!hh||hh.lat==null){if(hereMk){hereMk.remove();hereMk=null}return}
    if(!hereMk){const d=document.createElement('div');d.className='heredot';d.innerHTML='<i></i><b></b>';hereMk=new maplibregl.Marker({element:d,anchor:'center'}).setLngLat([hh.lon,hh.lat]).addTo(map)}
    else hereMk.setLngLat([hh.lon,hh.lat]);
    const acc=hereMk.getElement().querySelector('i');if(hh.acc){const mpp=156543.03*Math.cos(hh.lat*Math.PI/180)/Math.pow(2,map.getZoom());const r=Math.max(18,Math.min(240,hh.acc/mpp));acc.style.width=acc.style.height=(r*2)+'px'}}
  map.on('zoom',()=>{if(hereMk&&S.here&&S.here.gps)setHere(S.here)});
  window.addEventListener('resize',()=>map.resize());

    here:(h,instant)=>{const o={center:[h.lon,h.lat],zoom:GL_HOME_Z};instant||first?(map.jumpTo(o),first=false):map.flyTo({...o,duration:900})},
    restyle:()=>{map.setStyle(glStyle())}}
}

  for(let i=0;i<need.length;i+=100){const part=need.slice(i,i+100);
    const {data,error}=await CL.sb.storage.from('media').createSignedUrls(part,7*86400);
    if(!error&&data)data.forEach((d,k)=>{if(d.signedUrl)CL.urls[part[k]]={u:d.signedUrl,exp:now+7*86400e3}})}

    if(p.img&&p.img.startsWith('data:')){tp=`${CL.uid}/${sid}_t.jpg`;const r=await st.upload(tp,await dataURLBlob(p.img),{contentType:'image/jpeg',upsert:true});if(r.error)tp=null}
  }else if(p.img&&p.img.startsWith('data:')){mp=`${CL.uid}/${sid}.jpg`;const r=await st.upload(mp,await dataURLBlob(p.img),{contentType:'image/jpeg',upsert:true});if(r.error)throw r.error}
  const ins={id:sid,...row,kind:p.kind==='video'?'video':'photo',media_path:mp,thumb_path:tp,taken_at:p.takenAt?new Date(p.takenAt).toISOString():null,created_at:new Date(p.ts||Date.now()).toISOString(),via:isUUID(p.via)?p.via:null};
  const {error}=await sb.from('posts').upsert(ins);if(error)throw error;
  p.synced=true;p.tp=tp;p.mp=mp;await dbPutRaw(p);
}
function cloudUploadPending(){if(!CL.on)return;posts.filter(p=>p.uid==='me'&&!p.synced&&!String(p.id).startsWith('d')).forEach(cloudPush)}
async function cloudDelete(id){
  if(!CL.on)return;const sid=CL.sidOf[id]||(isUUID(id)?id:null);if(!sid)return;
  try{const {data}=await CL.sb.from('posts').select('media_path,thumb_path').eq('id',sid).maybeSingle();
    const {error}=await CL.sb.from('posts').delete().eq('id',sid);if(error)throw error;
    const files=[data&&data.media_path,data&&data.thumb_path].filter(Boolean);if(files.length)await CL.sb.storage.from('media').remove(files)}
  catch(e){console.warn(e);toast('サーバーから消せませんでした。通信を確認してください')}
}
async function cloudLike(id,on){
  if(!CL.on)return;const sid=sidOfPost(posts.find(p=>p.id===id));if(!sid)return;
  const q=on?CL.sb.from('likes').upsert({post_id:sid,user_id:CL.uid}):CL.sb.from('likes').delete().eq('post_id',sid).eq('user_id',CL.uid);
  const {error}=await q;if(error)console.warn(error);
}
async function cloudComment(id,text){
  if(!CL.on)return;const sid=sidOfPost(posts.find(p=>p.id===id));if(!sid){toast('アップロードが終わってからコメントできます');return}
  const {error}=await CL.sb.from('comments').insert({post_id:sid,body:text.slice(0,300)});if(error){console.warn(error);toast('コメントを送れませんでした')}
}
async function cloudSaveGroup(g,isNew){
  if(!CL.on)return true;const sb=CL.sb;
  try{
    if(isNew){const {error}=await sb.from('groups').insert({id:g.id,name:g.name});if(error)throw error}
    else{if(g.owner&&g.owner!=='me'){toast('グループを編集できるのは作った人だけです');await cloudRefresh();return false}
      const {error}=await sb.from('groups').update({name:g.name}).eq('id',g.id);if(error)throw error}
    const {data,error}=await sb.from('group_members').select('user_id').eq('group_id',g.id);if(error)throw error;
    const cur=new Set(data.map(r=>r.user_id).filter(u=>u!==CL.uid)),want=new Set(g.members.filter(isUUID));
    const add=[...want].filter(u=>!cur.has(u)).map(u=>({group_id:g.id,user_id:u})),del=[...cur].filter(u=>!want.has(u));
    if(add.length){const r=await sb.from('group_members').insert(add);if(r.error)throw r.error}
    if(del.length){const r=await sb.from('group_members').delete().eq('group_id',g.id).in('user_id',del);if(r.error)throw r.error}
    g.owner='me';return true;
  }catch(e){console.warn(e);toast('グループを保存できませんでした');return false}
}
async function cloudDelGroup(g){
  if(!CL.on)return;
  if(g.owner&&g.owner!=='me'){const {error}=await CL.sb.from('group_members').delete().eq('group_id',g.id).eq('user_id',CL.uid);if(error)console.warn(error);return}
  const {error}=await CL.sb.from('groups').delete().eq('id',g.id);if(error){console.warn(error);toast('グループを消せませんでした')}
}
async function cloudProfile(){if(!CL.on)return;const {error}=await CL.sb.from('profiles').update({name:me.name.slice(0,20),bio:(me.bio||'').slice(0,160)}).eq('id',CL.uid);if(error)toast('プロフィールをサーバーに保存できませんでした')}
async function cloudAvatar(dataURL){
  if(!CL.on)return;const st=CL.sb.storage.from('media'),path=`${CL.uid}/avatar.jpg`;
  try{if(dataURL){const r=await st.upload(path,await dataURLBlob(dataURL),{contentType:'image/jpeg',upsert:true});if(r.error)throw r.error;delete CL.urls[path]}
    const {error}=await CL.sb.from('profiles').update({avatar_path:dataURL?path:null}).eq('id',CL.uid);if(error)throw error}
  catch(e){console.warn(e);toast('アイコンをサーバーに保存できませんでした')}
}
async function cloudInviteInfo(code){const {data,error}=await CL.sb.rpc('invite_info',{code});if(error||!data||!data.length)return null;return data[0]}
async function cloudAccept(code){const {data,error}=await CL.sb.rpc('accept_invite',{code});if(error)throw error;await cloudLoad();return data}
async function cloudDeleteAccount(){
  const st=CL.sb.storage.from('media');
  for(;;){const {data,error}=await st.list(CL.uid,{limit:100});if(error||!data||!data.length)break;const r=await st.remove(data.map(f=>CL.uid+'/'+f.name));if(r.error)break}
  const {error}=await CL.sb.rpc('delete_me');if(error)throw error;
  await CL.sb.auth.signOut().catch(()=>{});
}
function cloudInviteLink(){return `${APP_URL}?openExternalBrowser=1#inv-${CL.code}`}
function openCloudInvite(){
  const link=cloudInviteLink(),msg=`Hueday（ヒューデイ）で一緒に思い出の地図を作ろう！\n${me.name}からの招待リンク👇\n${link}`;
  openSheet('友達を追加',`<div style="padding:0 16px;display:grid;gap:10px"><p style="margin:0">招待リンクをLINEで送って、相手が開いて「友達になる」を押すと追加されます。</p>
  <a class="btn line" href="https://line.me/R/share?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">LINEで招待リンクを送る</a>
  <div class="linkbox"><code>${esc(link)}</code><button class="btn" data-act="copylink">コピー</button></div>
  <h4 style="margin:8px 0 0">招待コードで追加</h4>
  <p class="note" style="padding:0">あなたのコード：<b style="user-select:all;font-family:ui-monospace,Menlo,monospace">${esc(CL.code)}</b></p>
  <div class="linkbox"><input id="invCode" placeholder="友達のコードを入力" autocapitalize="off" autocomplete="off" spellcheck="false" style="flex:1;min-width:0;border:0;background:none;font:inherit;color:inherit"><button class="btn" data-act="invcode">追加</button></div></div>`);
}
async function cloudHandleInvite(code){
  if(!CL.on){toast('サーバーにつながっていないため、招待を受け取れませんでした');return}
  const inv=await cloudInviteInfo(code);
  if(!inv){toast('招待リンクが見つかりませんでした');return}
  const self=inv.id===CL.uid,already=S.follow.includes(inv.id),name=inv.name;
  openSheet('招待が届きました',`<div style="padding:4px 16px;display:grid;gap:12px;justify-items:center;text-align:center"><span style="width:80px;height:80px;display:block">${avatar({name,c1:'#06C755',c2:'#4fb3e8'},'')}</span><b style="font:700 18px -apple-system,BlinkMacSystemFont,'Hiragino Sans',Roboto,'Noto Sans JP',sans-serif">${esc(name)}さんから、Huedayの招待です</b><span style="color:var(--sub);font-size:14px">友達になると、おたがいの投稿がホームに届き、一緒にグループの共有マップを作れます。</span>
  ${self?'<p class="note">これはあなた自身の招待リンクです。友達が開くと、この画面が表示されます。</p>':already?'<p class="note">すでに友達です。</p>':`<button class="btn pri" style="width:100%" data-act="acceptcode" data-code="${esc(code)}" data-name="${esc(name)}">友達になる</button>`}</div>`);
}

/* ---------- 起動 ---------- */
(async()=>{
  try{await loadGeo()}catch(err){$('#loading').textContent='地図データを読み込めませんでした';return}
  for(const p of posts){const r=locate(p.lon,p.lat);if(r)Object.assign(p,r)}
  const mine=await dbAll();posts.push(...mine);await cloudStart();
  const useGL=await glAvailable();
  const mapTap=(f,base)=>{
    if(typeof picking==='string'&&picking.startsWith('trip:')){const tid=picking.slice(5);const ll=projection.invert(base);picking=null;$('#pickbar').classList.remove('on');$('#pickbar').firstChild.textContent='思い出の場所をタップしてください';if(!ll)return;const r=locate(ll[0],ll[1])||{};const label=r.mc?muniName(r.mc):r.cc?cName(r.cc):'選んだ場所';openTrip.pend={lat:ll[1],lon:ll[0],r,label};S.planTab='trip';show('wish');openSheet('スポットを追加',`<div class="f" style="padding:0 16px;display:grid;gap:10px"><p style="margin:0">${esc(r.mc?prefName[r.pc]+' '+muniName(r.mc):label)}</p><input id="spName" value="${esc(openPlan.pendName||'')}" placeholder="場所の名前（例：〇〇水族館）" maxlength="30"><select id="spCat" style="border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:var(--card)">${CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div><div class="savebar"><button class="btn pri" data-act="tspotsave" data-t="${tid}">追加する</button></div><p class="note">地図はおおまかな位置です。正確な場所は名前で探すと確実です。</p>`);return}
    if(picking==='here'){const ll=projection.invert(base);if(ll){const r=locate(ll[0],ll[1]);S.here={lat:ll[1],lon:ll[0],label:r?(r.mc?prefName[r.pc]+' '+muniName(r.mc):cName(r.cc)):'地図で選んだ場所'};S.sort='near';save()}picking=null;$('#pickbar').classList.remove('on');$('#pickbar').firstChild.textContent='思い出の場所をタップしてください';show('disc');toast('現在地を設定しました。近い順に並べています');return}
    if(picking!=null){const ll=projection.invert(base);const q=queue[picking];if(q&&ll){q.lon=ll[0];q.lat=ll[1];const r=locate(ll[0],ll[1]);if(r){delete q.mc;delete q.pc;delete q.cc;Object.assign(q,r);q.src='tap'}}picking=null;$('#pickbar').classList.remove('on');openAdd();return}
    if(f)openRegion(f,S.mapUser)};
  if(useGL){$('#mainMap').remove();window.__glmapReady=1;document.querySelector('.mapattr')?.remove();mainMap=makeGLMap($('#glMap'),{onTap:mapTap});document.body.classList.add('glmode')}
  else mainMap=makeMap($('#mainMap'),{filterable:true,noFill:true,detail:true,onTap:mapTap});
  applyTheme();startI18n();$('#loading').remove();renderAll();show('map');syncCam();if(mainMap.setHere&&S.here&&S.here.gps)mainMap.setHere(S.here);fitHome(mainMap);tryLocate();handleInvite();
  window.addEventListener('hashchange',handleInvite);
})();
}
</script>
