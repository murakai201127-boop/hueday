<h1>Hueday 利用規約</h1>
<p class="d">制定日：2026年11月26日</p>
<p>この利用規約（以下「本規約」）は、Hueday運営事務局（以下「運営者」といいます）が提供するアプリ「Hueday」（以下「本サービス」）の利用条件を定めるものです。本サービスを利用する方（以下「利用者」）は、本規約に同意したうえでご利用ください。</p>
<h2>第1条（利用の条件）</h2>
<ol><li>利用者は、本規約とプライバシーポリシーに同意した場合に限り、本サービスを利用できます。</li>
<li>18歳未満の方は、保護者の同意を得たうえでご利用ください。</li></ol>
<h2>第2条（アカウント）</h2>
<ol><li>本サービスは、端末ごとに自動で作られるアカウントを使います。利用者は、自分の端末とアカウントを自分の責任で管理してください。</li>
<li>利用者は、設定画面からいつでもアカウントと投稿を削除できます。</li></ol>
<h2>第3条（投稿したコンテンツ）</h2>
<ol><li>写真・動画・文章・マップ・コース等（以下「投稿」）の権利は、投稿した利用者に残ります。</li>
<li>利用者は、運営者が本サービスを提供・表示・改善するために必要な範囲で、投稿を無償で利用（保存・複製・サイズ変更・表示）することを許諾します。運営者がこの範囲を超えて投稿を利用することはありません。</li>
<li>利用者は、投稿について必要な権利（著作権、写っている人の了承など）を自分が持っていることを保証します。</li></ol>
<h2>第4条（公開範囲）</h2>
<ol><li>投稿ごとに「自分だけ」「グループ」「相互フォローのみ」「一般公開」を選べます。「相互フォローのみ」はお互いにフォローしている人だけが見られます。「一般公開」にした投稿は、あなたをフォローしている人のタイムラインに表示されるほか、本サービスの利用者であればだれでも、検索やおすすめを通じて見ることができます。</li>
<li>一般公開する前に、人の顔、車のナンバー、自宅や表札など、個人が特定される情報が写っていないか確認してください。</li>
<li>自宅・職場として登録した場所の近くの投稿は、位置をぼかしたり、一般公開できないようにしたりする場合があります。</li></ol>
<h2>第5条（禁止事項）</h2>
<p>利用者は、次の行為をしてはいけません。</p>
<ul><li>法令や公序良俗に反する行為、犯罪につながる行為</li>
<li>他人の著作権・肖像権・プライバシーその他の権利を侵害する行為（他人が写った写真を許可なく一般公開することを含みます）</li>
